[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "python-mcp-bootstrap"
dynamic = ["version"]
description = "Pre-install Python runtime bootstrap for MCP applications."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "python", "bootstrap", "runtime", "uv"]
authors = [{ name = "Ron", email = "4zhmv6zvj2-afk@users.noreply.github.com" }]
maintainers = [{ name = "Ron", email = "4zhmv6zvj2-afk@users.noreply.github.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
  "mypy>=1.13",
  "build>=1.2",
  "ruamel.yaml>=0.19",
]

[project.scripts]
python-mcp-bootstrap = "python_mcp_bootstrap.cli:main"

[project.urls]
Repository = "https://github.com/4zhmv6zvj2-afk/python-mcp-bootstrap"
Documentation = "https://github.com/4zhmv6zvj2-afk/python-mcp-bootstrap/blob/main/README.md"
Changelog = "https://github.com/4zhmv6zvj2-afk/python-mcp-bootstrap/blob/main/CHANGELOG.md"
Issues = "https://github.com/4zhmv6zvj2-afk/python-mcp-bootstrap/issues"

[tool.hatch.version]
path = "src/python_mcp_bootstrap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/python_mcp_bootstrap"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
  "/.python-version",
  "/requirements-ci.txt",
  "/requirements-build.txt",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
# Warnings are errors: the suite must stay warning-clean.
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["python_mcp_bootstrap", "scripts"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# S603/S606/S607: every subprocess call passes a fixed argv list with shell=False.
ignore = ["E501", "S603", "S606", "S607"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the test mechanism; fixed temp paths are test fixtures.
"tests/**" = ["S101", "S108"]
# "token" literals here are redaction keys, not credentials.
"src/python_mcp_bootstrap/core.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["python_mcp_bootstrap"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "scripts"]
