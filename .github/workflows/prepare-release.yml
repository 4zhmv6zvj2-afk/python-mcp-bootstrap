name: prepare-release

# Builds the release artifacts once and attaches them to a DRAFT GitHub release.
# It never publishes the release and never talks to PyPI. Publishing the draft
# (see CONTRIBUTING) makes the release immutable and fires publish.yml, which
# only verifies the existing assets and then publishes to PyPI.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to prepare (for example v0.1.1)
        required: true

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write  # create the draft and attach assets
      id-token: write  # attestation and Sigstore keyless signing
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Restore annotated release tag
        shell: bash
        run: |
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Release invariants (pre-build)
        run: python scripts/release_check.py

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create or reuse a draft release
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to modify it"
              exit 1
            fi
            echo "reusing existing draft release $TAG"
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "python-mcp-bootstrap $TAG" \
              --notes-file "docs/releases/${VERSION}.md"
            echo "created draft release $TAG"
          fi

      - name: Upload release artifacts
        run: gh release upload "$TAG" dist/* --clobber

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Write provenance file
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign release artifacts
        working-directory: dist
        run: |
          for f in *; do
            case "$f" in
              *.sigstore.json|provenance.intoto.jsonl) continue ;;
            esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Upload signatures
        run: gh release upload "$TAG" dist/*.sigstore.json --clobber

      - name: Attach build provenance
        run: gh release upload "$TAG" dist/provenance.intoto.jsonl --clobber

      - name: Release invariants (final, draft assets)
        run: python scripts/release_check.py --tag "$TAG"
