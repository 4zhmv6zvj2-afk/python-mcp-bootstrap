name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14.10", "3.15.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Restore annotated release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format
        run: python -m ruff format --check
      - name: Lint
        run: python -m ruff check
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest --cov=python_mcp_bootstrap --cov-report=term-missing --cov-fail-under=90

  py312-smoke:
    name: Python 3.12 import and exercise
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Restore annotated release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run the bootstrap suite on 3.12
        run: python -m pytest tests -q

  package:
    name: Wheel and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Restore annotated release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.15.2"
      - name: Install build tooling
        run: python -m pip install build
      - name: Release invariants
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/release_check.py --tag "$REF_NAME"
          else
            python scripts/release_check.py
          fi
      - name: Build wheel and sdist
        run: python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install --upgrade pip
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wheel-check/bin/python -m python_mcp_bootstrap --check
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  example:
    name: Vendored example first run (real uv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Show uv version
        run: uv --version
      - name: Vendor the core into the example
        run: python scripts/vendor.py --target examples --dest _vendor/python_mcp_bootstrap.py
      - name: Check the vendored copy
        run: python scripts/vendor.py --target examples --dest _vendor/python_mcp_bootstrap.py --check
      - name: Run the first-run example
        working-directory: examples
        run: python first_run.py --install-python
