name: sign-release

# Signs the assets of an existing GitHub release with Sigstore (keyless, via the
# workflow's OIDC identity) and uploads the resulting .sigstore.json bundles.
# Used to retrofit signatures onto releases created before signing was
# automated in publish.yml (OpenSSF Scorecard Signed-Releases).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose assets should be signed"
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # upload signature bundles to the release
      id-token: write  # Sigstore keyless signing via OIDC
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir assets

      - name: Sign assets
        working-directory: assets
        run: |
          for f in *; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Upload signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" assets/*.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
