name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: write  # attach artifacts and signatures to the GitHub release
      id-token: write  # PyPI trusted publishing and provenance signing
      attestations: write  # GitHub build-provenance attestation store
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Restore annotated release tag
        shell: bash
        run: |
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Release invariants
        run: python scripts/release_check.py --tag "$TAG"

      - name: Build wheel and sdist
        run: python -m build

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

      # Attach and sign the release artifacts so the published downloads carry
      # tamper-evident signatures (OpenSSF Scorecard Signed-Releases).
      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign release assets
        if: github.event_name == 'release'
        working-directory: dist
        run: |
          for f in *; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Upload signatures
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.sigstore.json --clobber

      - name: Attach build provenance
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.intoto.jsonl
          gh release upload "$TAG" dist/provenance.intoto.jsonl --clobber
