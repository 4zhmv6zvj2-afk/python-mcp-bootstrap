name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Restore annotated release tag
        shell: bash
        run: |
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install build tooling
        run: python -m pip install build

      - name: Release invariants
        run: python scripts/release_check.py --tag "$TAG"

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
