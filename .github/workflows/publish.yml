name: publish

# Verifies the assets already attached to a published (therefore immutable)
# GitHub release and then publishes the distributions to PyPI. This workflow
# deliberately has no contents:write permission and performs no release
# uploads: the workflow that can spend the PyPI credential must be unable to
# alter the artifacts it publishes.
#
# Artifacts are built and attached by prepare-release.yml while the release is
# still a draft. Publishing the draft fires this workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published annotated release tag to publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Verify release assets and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing
      attestations: read  # verify the build-provenance attestation
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Restore annotated release tag
        shell: bash
        run: |
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Require a published, immutable release
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist"
            exit 1
          fi
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')" != "false" ]; then
            echo "::error::release $TAG is still a draft; publish it with prepare-release first"
            exit 1
          fi
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.immutable')" != "true" ]; then
            echo "::error::release $TAG is not immutable; refusing to publish unverified assets"
            exit 1
          fi

      - name: Download published distributions
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern "*.whl" --pattern "*.tar.gz" --pattern "SHA256SUMS" \
            --pattern "*.sigstore.json"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Verify release assets, signatures and provenance
        run: python scripts/release_check.py --tag "$TAG"

      - name: Verify build provenance attestations
        run: |
          gh attestation verify dist/*.whl --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/*.tar.gz --repo "$GITHUB_REPOSITORY"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Verify Sigstore bundles
        shell: bash
        run: |
          set -euo pipefail
          # prepare-release.yml is dispatched from main and signs while the
          # draft is built, so its OIDC identity is the workflow at
          # refs/heads/main. Tag refs are accepted if a future preparation
          # flow is triggered from a tag instead.
          identity='^https://github\.com/4zhmv6zvj2-afk/python-mcp-bootstrap/\.github/workflows/prepare-release\.yml@(refs/heads/main|refs/tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
          issuer='https://token.actions.githubusercontent.com'
          for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS; do
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$artifact"
          done

      - name: Stage PyPI distributions only
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/

      - name: Publish with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: pypi-dist/
