name: release-gate

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Published release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Wait for the publish workflow to attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          for _ in $(seq 1 40); do
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -qx "provenance.intoto.jsonl" \
              && printf '%s\n' "$assets" | grep -qx "SHA256SUMS"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::release assets did not appear within 10 minutes"
          exit 1

      - name: Verify tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_check.py --tag "${{ github.event.release.tag_name }}"
