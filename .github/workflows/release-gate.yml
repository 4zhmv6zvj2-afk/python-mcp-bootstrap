name: release-gate

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Published release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.15.2"
      - name: Verify tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_check.py --tag "${{ github.event.release.tag_name }}"
